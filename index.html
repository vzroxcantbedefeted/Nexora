<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clario AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    
    <header>
      <h1>Clario AI</h1>
      <p>Turn messy text into clean, readable notes</p>
    </header>

    <div class="card">
      <textarea id="inputText" placeholder="Paste messy notes here..."></textarea>
      
      <button onclick="processText()">✨ Simplify</button>
    </div>

    <div class="card output">
      <h3>Result</h3>
      <pre id="outputText">Your clean notes will appear here...</pre>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
